name: Windows installer

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test Muralis.slnx --configuration Release

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Muralis/Muralis.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o src/Muralis/bin/Release/net10.0-windows/win-x64/publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          Push-Location installer
          try { & $iscc "Muralis.iss"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          finally { Pop-Location }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Muralis-Setup-1.3.1-win-x64
          path: dist/Muralis-Setup-1.3.1.exe
          if-no-files-found: error
          retention-days: 14
